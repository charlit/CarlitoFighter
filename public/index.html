<script>
'use strict';
// ================= réglages =================
const W = 960, H = 540, GROUND = 478;
const GRAV = 0.75;
const ROUND_TIME = 60, WIN_ROUNDS = 2;   // manches de 60 s, 2 manches gagnantes
const HEAD_H = 96;                       // hauteur de la grosse tête
const STICK = 50, SWIPE = 34;            // joystick tactile invisible : course du pouce, glissé pour sauter / s'accroupir
const OUTLINE = '#1b1b2f';
const DEBUG = new URLSearchParams(location.search).has('debug');

// Les personnages. Pour renommer, change name. flip: true = la photo regarde vers la gauche.
// speed : vitesse de marche, jump : impulsion de saut, hp : vie, pow : multiplicateur de dégâts, sp : coup spécial.
const CHARS = [
  { src: 'heads/p1.png', name: 'Carlito', flip: true, shirt: '#ff3b3b', pants: '#1d3f94', glove: '#ffd93d', skin: '#e8b48f',
    speed: 3.8, jump: -15.5, hp: 100, pow: 1, sp: 'soleil', spName: 'Rayon de soleil', spDesc: 'Lance une boule de soleil', stage: 0 },
  { src: 'heads/p2.png', name: 'Moustache', shirt: '#2fa36b', pants: '#4a3320', glove: '#ffffff', skin: '#e9a98a',
    speed: 4.6, jump: -16, hp: 100, pow: 1.12, sp: 'dash', spName: 'Charge moustache', spDesc: 'Fonce à travers l’écran', stage: 1 },
  { src: 'heads/p3.png', name: 'Nono', flip: true, shirt: '#f4f4f4', pants: '#f4f4f4', glove: '#ff3b3b', skin: '#e2a882', belt: '#1b1b2f',
    speed: 3.8, jump: -15.5, hp: 92, pow: 0.95, sp: 'upper', spName: 'Super uppercut', spDesc: 'Contre les sauts (on l’évite accroupi)', stage: 2 },
  { src: 'heads/p4.png', name: 'Le Boss', shirt: '#2b2b3a', pants: '#2b2b3a', glove: '#8a1b1b', skin: '#b07a55', tie: '#e0241b',
    speed: 2.9, jump: -13.5, hp: 120, pow: 1.2, sp: 'slam', spName: 'Tremblement', spDesc: 'Fait trembler le sol : saute pour l’éviter !', stage: 3 },
  { src: 'heads/p5.png', name: 'Éclipse', flip: true, shirt: '#7a3bff', pants: '#1b1b2f', glove: '#bdb7ff', skin: '#b9784f',
    speed: 3.9, jump: -16.5, hp: 96, pow: 1, sp: 'tp', spName: 'Éclipse totale', spDesc: 'Disparaît et frappe dans le dos', stage: 4 },
  { src: 'heads/p6.png', name: 'Maxou', shirt: '#ff9f1c', pants: '#8a1b1b', glove: '#ff3b1c', skin: '#f2c3a3',
    speed: 4, jump: -15.5, hp: 104, pow: 1, sp: 'tornado', spName: 'Tornade de feu', spDesc: 'Tourne en avançant, plusieurs coups', stage: 5 },
];
// Chaque tête détourée reçoit un contour noir cartoon qui suit sa silhouette (calculé une fois au chargement).
const SPRITE_H = 360, SPRITE_O = 13;
function makeSprite(img) {
  const h = SPRITE_H, w = Math.round(h * img.naturalWidth / img.naturalHeight), o = SPRITE_O;
  const c = document.createElement('canvas'); c.width = w + 2 * o; c.height = h + 2 * o;
  const g = c.getContext('2d');
  for (let a = 0; a < 24; a++) g.drawImage(img, o + Math.cos(a * Math.PI / 12) * o, o + Math.sin(a * Math.PI / 12) * o, w, h);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = OUTLINE; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-over'; g.drawImage(img, o, o, w, h);
  return c;
}
CHARS.forEach((h) => { h.img = new Image(); h.img.onload = () => { h.sprite = makeSprite(h.img); }; h.img.src = h.src; });
const BOSS = 3; // Le Boss n'est pas jouable : c'est le dernier adversaire de l'aventure
const PICKABLE = CHARS.map((_, k) => k).filter((k) => k !== BOSS);
const COLORS = [{ main: '#ff3b3b', dark: '#8a1520' }, { main: '#2f7bff', dark: '#15307a' }];

// Coups : st = images de préparation, act = images actives, rec = récupération. hb = zone de frappe [x devant, y, largeur, hauteur]
// depuis les pieds. h : 'low' = à parer accroupi, 'high' = à parer debout (coups sautés). kd = met au sol.
const MOVES = {
  punch:   { st: 4, act: 3, rec: 9, dmg: 5, hb: [14, -140, 58, 26], stun: 14, bstun: 9, push: 4 },
  kick:    { st: 7, act: 4, rec: 15, dmg: 8, hb: [14, -108, 78, 30], stun: 18, bstun: 11, push: 6 },
  cpunch:  { st: 4, act: 3, rec: 9, dmg: 4, hb: [14, -104, 58, 24], stun: 12, bstun: 8, push: 3, crouch: true },
  ckick:   { st: 6, act: 4, rec: 18, dmg: 7, hb: [10, -26, 86, 26], stun: 18, bstun: 11, push: 5, crouch: true, h: 'low', kd: true },
  jpunch:  { st: 3, act: 10, rec: 4, dmg: 6, hb: [8, -130, 54, 40], stun: 16, bstun: 10, push: 3, air: true, h: 'high' },
  jkick:   { st: 4, act: 12, rec: 4, dmg: 8, hb: [8, -70, 66, 40], stun: 18, bstun: 11, push: 4, air: true, h: 'high' },
  soleil:  { st: 14, act: 1, rec: 22, special: true },
  dash:    { st: 7, act: 18, rec: 14, dmg: 12, hb: [0, -160, 62, 90], stun: 22, bstun: 14, push: 7, kd: true, special: true },
  upper:   { st: 3, act: 14, rec: 22, dmg: 12, hb: [0, -270, 50, 120], stun: 22, bstun: 14, push: 4, kd: true, special: true, inv: 6 },
  slam:    { st: 22, act: 3, rec: 26, dmg: 12, hb: [-230, -34, 460, 34], stun: 22, bstun: 14, push: 6, kd: true, special: true },
  tp:      { st: 14, act: 5, rec: 14, dmg: 9, hb: [10, -160, 64, 70], stun: 20, bstun: 12, push: 5, special: true, inv: 14 },
  tornado: { st: 5, act: 36, rec: 10, dmg: 5, hb: [-56, -140, 112, 70], stun: 14, bstun: 8, push: 2, multi: 9, special: true },
};
const SUN_HIT = { dmg: 10, stun: 20, bstun: 14, push: 6, special: true };
const total = (m) => m.st + m.act + m.rec;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
// Résolution réelle du canvas = taille affichée × densité de l'écran (net sur Retina), le jeu reste en coordonnées 960×540.
let SCALE = 1;
function fitCanvas() {
  const s = clamp(Math.round(devicePixelRatio * (canvas.clientWidth || W) / W * 4) / 4, 1, 2.5);
  if (s === SCALE && canvas.width === Math.round(W * s)) return;
  SCALE = s; canvas.width = Math.round(W * s); canvas.height = Math.round(H * s);
  drawBackground();
}
addEventListener('resize', fitCanvas);

// ================= modes =================
// mode : 'ai' (aventure contre l'ordinateur), 'local' (2 joueurs, même écran), 'online' (contre un joueur en ligne)
let mode = 'local', aiLevel = 1;
let me = 0;                       // joueur contrôlé par cet appareil en solo / en ligne (1 = invité en ligne)
const aiSlots = [null, null];     // niveau d'IA de chaque joueur (null = humain)
const AI_LEVELS = [
  { name: 'Facile', think: 26, block: 0.1, atk: 0.3, sp: 0.08, anti: 0.1, idle: 0.35 },
  { name: 'Moyen', think: 12, block: 0.45, atk: 0.6, sp: 0.25, anti: 0.45, idle: 0.1 },
  { name: 'Difficile', think: 5, block: 0.85, atk: 0.85, sp: 0.4, anti: 0.85, idle: 0 },
];
const MENU = [
  { label: 'AVENTURE', mode: 'ai', c: '#ffd93d' },
  { label: '2 JOUEURS · MÊME ÉCRAN', mode: 'local', c: '#2f7bff' },
  { label: 'EN LIGNE', mode: 'online', c: '#ff7ad9' },
];
// page suivante de l'aventure : la difficulté
const LEVELS = [
  { label: 'FACILE', sub: 'Pour découvrir les coups', c: '#3ddc84' },
  { label: 'MOYEN', sub: 'Il faut savoir parer', c: '#ffd93d' },
  { label: 'DIFFICILE', sub: 'Le Boss ne pardonne rien', c: '#ff3b3b' },
];
const pillRect = (k) => ({ x: W / 2 - 240, y: 160 + k * 84, w: 480, h: 62 });
// grille de choix : 3 persos en haut, 2 en bas (j = rang dans PICKABLE)
const gridPos = (j) => j < 3 ? { x: W / 2 + (j - 1) * 128, y: 222 } : { x: W / 2 + (j - 3.5) * 128, y: 350 };
let menuSel = 0, levelSel = 1;
// aventure : on affronte les 4 autres personnages jouables, puis Le Boss en dernier
let ladder = [], ladderIdx = 0;

// ================= entrées =================
// Chaque joueur a un contrôle unifié : x (-1..1), y (-1 haut, 1 accroupi) et des files d'attente courtes pour les boutons
// p (poing), k (pied), s (spécial), u (saut) : un appui rapide n'est jamais perdu, même par le réseau (compteurs sent/seen).
const BTNS = ['p', 'k', 's', 'u'];
const newCtl = () => ({ x: 0, y: 0, q: { p: 0, k: 0, s: 0, u: 0 }, prev: {}, sent: { p: 0, k: 0, s: 0, u: 0 }, seen: { p: 0, k: 0, s: 0, u: 0 } });
const ctl = [newCtl(), newCtl()];
function queue(i, b) { ctl[i].q[b] = 8; ctl[i].sent[b]++; }
function resetCtl() { ctl[0] = newCtl(); ctl[1] = newCtl(); }

// e.code = position physique : KeyW/A/S/D = Z/Q/S/D sur un clavier AZERTY.
const KEYMAP = [
  { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], p: ['KeyF'], k: ['KeyG'], s: ['KeyH'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], p: ['KeyK', 'Numpad1'], k: ['KeyL', 'Numpad2'], s: ['Semicolon', 'Numpad3'] },
];
const GAME_KEYS = new Set(KEYMAP.flatMap((m) => Object.values(m).flat()).concat(['Escape', 'Space', 'Enter']));
const keysDown = new Set();
const dbgHeld = new Set();
const anyKey = (m, k) => KEYMAP[m][k].some((c) => keysDown.has(c));
addEventListener('keydown', (e) => {
  unlockAudio();
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  touchMode = false;
  if (!e.repeat) uiKey(e.code);
  keysDown.add(e.code);
});
addEventListener('keyup', (e) => keysDown.delete(e.code));
addEventListener('blur', () => keysDown.clear());

// ---- tactile ----
// Pouce gauche = joystick invisible (glisser ◀ ▶ marcher, vers le haut sauter, vers le bas s'accroupir).
// À droite, 3 boutons : poing, pied, spécial. À 2 sur le même écran : une moitié d'écran chacun, boutons vers le centre.
let touchMode = matchMedia('(pointer: coarse)').matches;
const touches = new Map();
const IN_MATCH = ['intro', 'fight', 'ko'];
function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function btnsOf(p) {
  const cx = mode === 'local' ? (p === 0 ? W / 2 - 130 : W / 2 + 130) : W - 150;
  return [
    { k: 'p', x: cx - 58, y: H - 64, r: 38, c: '#ff3b3b', t: 'POING' },
    { k: 'k', x: cx + 58, y: H - 64, r: 38, c: '#2f7bff', t: 'PIED' },
    { k: 's', x: cx, y: H - 150, r: 38, c: '#ffd93d', t: '★' },
  ];
}
document.addEventListener('pointerdown', (e) => {
  unlockAudio();
  if (e.pointerType !== 'mouse') touchMode = true;
  e.preventDefault();
  const pt = toCanvas(e);
  if (!IN_MATCH.includes(state)) { uiTap(pt); return; }
  if (!touchMode) return;
  const p = mode === 'local' ? (pt.x < W / 2 ? 0 : 1) : me;
  const b = btnsOf(p).find((q) => Math.hypot(pt.x - q.x, pt.y - q.y) < q.r + 12);
  if (b) { queue(p, b.k); touches.set(e.pointerId, { p, role: 'btn', k: b.k }); return; }
  const hasStick = [...touches.values()].some((t) => t.p === p && t.role === 'stick');
  touches.set(e.pointerId, { p, role: hasStick ? 'none' : 'stick', x0: pt.x, y0: pt.y, x: pt.x, y: pt.y, up: false, dn: false });
}, { passive: false });
document.addEventListener('pointermove', (e) => {
  const t = touches.get(e.pointerId);
  if (!t || t.role !== 'stick') return;
  const pt = toCanvas(e);
  t.x = pt.x; t.y = pt.y;
  const dx = t.x - t.x0;
  if (Math.abs(dx) > STICK) t.x0 = t.x - Math.sign(dx) * STICK;
  const dy = t.y - t.y0;
  if (dy < -SWIPE && !t.up) { t.up = true; queue(t.p, 'u'); }
  else if (dy > -SWIPE / 2 && t.up) t.up = false;
  t.dn = dy > SWIPE * 0.8;
  if (Math.abs(dy) > SWIPE * 2) t.y0 = t.y - Math.sign(dy) * SWIPE * 2; // le pouce peut continuer sans fin
});
['pointerup', 'pointercancel'].forEach((ev) => document.addEventListener(ev, (e) => touches.delete(e.pointerId)));
document.addEventListener('contextmenu', (e) => e.preventDefault());
function touchInput(i) {
  for (const t of touches.values()) {
    if (t.p !== i || t.role !== 'stick') continue;
    const dx = t.x - t.x0;
    return { x: Math.abs(dx) < 10 ? 0 : clamp(dx / (STICK * 0.6), -1, 1), y: t.up ? -1 : t.dn ? 1 : 0 };
  }
  return null;
}

function gatherInputs() {
  for (const i of [0, 1]) {
    const c = ctl[i];
    if (net && net.role === 0 && i === 1) {
      const r = net.remote;
      c.x = clamp(+r.x || 0, -1, 1); c.y = clamp(+r.y || 0, -1, 1);
      for (const b of BTNS) if (r[b] > c.seen[b]) { c.seen[b] = r[b]; c.q[b] = 8; }
      continue;
    }
    const owners = mode === 'local' ? [i] : i === me ? [0, 1] : [];
    const held = (k) => owners.some((m) => anyKey(m, k)) || dbgHeld.has(i + ':' + k);
    let x = (held('right') ? 1 : 0) - (held('left') ? 1 : 0), y = (held('down') ? 1 : 0) - (held('up') ? 1 : 0);
    const btn = { p: held('p'), k: held('k'), s: held('s') };
    const t = touchInput(i);
    if (t) { if (!x) x = t.x; if (!y) y = t.y; }
    if (aiSlots[i] !== null) {
      const a = aiThink(players[i], AI_LEVELS[aiSlots[i]]);
      x = a.x; y = a.y; btn.p = a.b === 'p'; btn.k = a.b === 'k'; btn.s = a.b === 's';
    }
    c.x = x; c.y = y;
    btn.u = y < 0;
    for (const b of BTNS) { if (btn[b] && !c.prev[b]) queue(i, b); c.prev[b] = btn[b]; }
  }
}

// ================= IA =================
// Elle réagit aux attaques (parade selon son niveau), saute les boules de soleil, contre les sauts,
// avance, frappe à portée et place son coup spécial quand la distance s'y prête.
const SP_RANGE = { soleil: [150, 999], dash: [100, 380], upper: [0, 90], slam: [0, 210], tp: [130, 999], tornado: [0, 210] };
function aiThink(p, L) {
  const o = players[1 - p.i], dx = o.x - p.x, d = Math.abs(dx), f = dx >= 0 ? 1 : -1, a = p.ai;
  const om = o.st === 'atk' && MOVES[o.move];
  const proj = projectiles.find((q) => q.owner === o.i && (p.x - q.x) * q.vx > 0 && Math.abs(p.x - q.x) < 260);
  const threat = !!proj || (om && om.hb && o.t < om.st + om.act && d < (om.special ? 320 : 170));
  if (threat && !a.threat) { a.def = Math.random() < L.block; a.hop = Math.random() < 0.4; }
  a.threat = threat;
  if (threat && a.def) {
    if (proj && a.hop && d > 140 && p.onGround) return { x: f, y: -1, b: null }; // saute par-dessus la boule
    return { x: -f, y: om && om.h === 'low' ? 1 : 0, b: null };
  }
  const sp = CHARS[p.c].sp, spOk = () => canSpecial(p) && d >= SP_RANGE[sp][0] && d <= SP_RANGE[sp][1];
  // contre un saut
  if (!o.onGround && o.st !== 'down' && !a.air) { a.air = true; a.anti = Math.random() < L.anti; }
  if (o.onGround) a.air = false;
  if (a.anti && !o.onGround && d < 150 && p.onGround && p.st === 'free') {
    a.anti = false;
    return { x: 0, y: 0, b: sp === 'upper' && canSpecial(p) ? 's' : 'k' };
  }
  if (--a.n > 0) return { x: a.x, y: a.y, b: null };
  a.n = L.think + Math.random() * L.think;
  let x = 0, y = 0, b = null;
  if (Math.random() < L.idle) x = 0;
  else if (!p.onGround) { x = a.x; if (d < 130) b = Math.random() < 0.5 ? 'k' : 'p'; }
  else if (d > 190) {
    x = f;
    if (Math.random() < L.sp && spOk()) b = 's';
    else if (Math.random() < 0.1) y = -1;
  } else if (d > 105) {
    x = Math.random() < 0.75 ? f : -f;
    if (Math.random() < 0.15) y = -1;
    if (Math.random() < L.sp && spOk()) b = 's';
  } else if (Math.random() < L.atk) {
    const r = Math.random();
    b = r < 0.4 ? 'p' : 'k'; y = r > 0.75 ? 1 : 0;
    if (Math.random() < L.sp * 0.6 && spOk()) b = 's';
  } else x = Math.random() < 0.5 ? -f : 0;
  a.x = x; a.y = y < 0 ? 0 : y;
  return { x, y, b };
}

// ================= sons (Web Audio, synthétisés) et annonceur (synthèse vocale du navigateur) =================
let ac = null;
function unlockAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* pas de son */ }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!ac) return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.6; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start();
}
function say(t) {
  if (!ac || !window.speechSynthesis) return;
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.9; u.pitch = 0.5; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { /* pas de voix */ }
}
const sfx = {
  swing: () => noise(0.09, 0.25, 2200),
  hit: () => { noise(0.1, 0.6, 700); tone('square', 160, 60, 0.1, 0.18); },
  bighit: () => { noise(0.22, 0.8, 450); tone('square', 120, 40, 0.22, 0.28); },
  block: () => tone('triangle', 950, 700, 0.09, 0.16),
  jump: () => tone('sine', 300, 600, 0.1, 0.05),
  down: () => { noise(0.25, 0.6, 250); tone('sine', 90, 40, 0.25, 0.2); },
  soleil: () => tone('sawtooth', 200, 900, 0.35, 0.1),
  dash: () => noise(0.4, 0.4, 1200),
  upper: () => tone('square', 200, 800, 0.25, 0.12),
  slam: () => { noise(0.6, 0.9, 150); tone('sine', 80, 30, 0.6, 0.4); },
  tp: () => tone('sine', 1400, 90, 0.35, 0.12),
  tornado: () => { noise(0.6, 0.5, 900); tone('sawtooth', 140, 60, 0.6, 0.12); },
  ko: () => { noise(2, 0.7, 900); tone('square', 220, 50, 0.7, 0.25); say('K.O.'); },
  time: () => { tone('sine', 2300, 2200, 0.5, 0.12); say('Time!'); },

// ================= état du jeu =================

// ---- menus : clavier ----

  if (state === 'menu') {
    if (is('up')) { menuSel = (menuSel + MENU.length - 1) % MENU.length; sfx.tick(); }
    if (is('down')) { menuSel = (menuSel + 1) % MENU.length; sfx.tick(); }

  } else if (state === 'level') {
    if (is('up')) { levelSel = (levelSel + 2) % 3; sfx.tick(); }

    if (ok) chooseLevel(levelSel);

      else if (is('right', maps)) pick[i] = PICKABLE[(j + 1) % n];
      else if (is('up', maps) || is('down', maps)) pick[i] = PICKABLE[j < 3 ? Math.min(j + 3, n - 1) : j - 3];
      else return;

      for (const i of [0, 1]) {
        if (!ready[i]) move(i, [i]);
        if (is('p', [i]) || is('k', [i]) || is('s', [i])) { ready[i] = !ready[i]; sfx.tick(); }

// ================= en ligne =================
// Le serveur met en relation deux joueurs puis relaie leurs messages. Le 1er arrivé (role 0, J1 rouge) fait tourner
// le combat et envoie l'état à chaque image ; l'invité (role 1, J2 bleu) envoie seulement ses commandes.

  if (net && net.role === 1) guestStep();
  else if (state === 'vs') { if (++vsT >= 170) startRound(); }
  else if (state === 'intro') {
    resetCtl();
    players.forEach((p) => updateFighter(p, players[1 - p.i]));
    if (--cd <= 0) { state = 'fight'; } else if (cd === 50) fx('fight');
  } else if (state === 'fight') {
    gatherInputs();
    if (hitstop > 0) hitstop--;
    else {
      timeLeft -= 1 / 60;
      players.forEach((p) => updateFighter(p, players[1 - p.i]));
      pushApart();
      updateProjectiles();
      players.map((p) => detectHit(p, players[1 - p.i])).forEach((h) => h && applyHit(...h));
      checkRoundEnd();
    }
  } else if (state === 'ko') {
    resetCtl();
    if (koT > 150 && frame % 3) { /* ralenti */ } else {
      players.forEach((p) => updateFighter(p, players[1 - p.i]));
      pushApart(); updateProjectiles();
    }
    const w = players[roundWin];
    if (w && koT < 120 && w.st === 'free' && w.onGround) w.st = 'win';
    if (--koT <= 0) {
      if (wins[0] >= WIN_ROUNDS || wins[1] >= WIN_ROUNDS) endMatch();
      else { round++; startRound(); }
    }
  } else if (state === 'end') endT++;
  if (net && net.role === 0 && net.ws.readyState === 1 && state !== 'wait' && (state !== 'end' || endT < 3)) net.ws.send(JSON.stringify(snapshot()));
  stepFx();
}
// invité en ligne : pas de simulation, il envoie ses commandes et affiche l'état reçu de l'hôte
function guestStep() {
  if (state === 'end') endT++;
  if (state !== 'fight') return;
  gatherInputs();
  const c = ctl[1];
  const s = JSON.stringify({ t: 'in', x: Math.round(c.x * 100) / 100, y: c.y, ...c.sent });
  if ((s !== net.lastIn || frame % 30 === 0) && net.ws.readyState === 1) { net.ws.send(s); net.lastIn = s; }
  for (const b of BTNS) c.q[b] = 0;
}

const FIRE = ['#fff3b0', '#ffd93d', '#ff9f1c', '#ff5b1c', '#e0241b'];
const CONFETTI = ['#ffd93d', '#ff3b3b', '#2f7bff', '#3ddc84', '#ffffff', '#ff7ad9'];
function burst(x, y, n, colors, speed, kind = 'spark') {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.8);
    particles.push({ kind, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 14 + Math.random() * 12, max: 26, c: colors[i % colors.length], s: 3 + Math.random() * 4, g: kind === 'spark' ? 0.15 : -0.05 });
  }
}
function ring(x, y, r, dr, c, life, flat = 1) { particles.push({ kind: 'ring', x, y, r, dr, c, life, max: life, flat, vx: 0, vy: 0, g: 0 }); }
// joue un son + ses particules ; l'hôte en ligne le transmet à l'invité
function fx(name, x = 0, y = 0, remote = false) {
  sfx[name] && sfx[name]();
  if (!remote && net && net.role === 0) events.push([name, Math.round(x), Math.round(y)]);
  if (name === 'hit') { burst(x, y, 14, ['#fff', '#ffd93d', '#fff3b0'], 7); ring(x, y, 10, 3, '#fff', 10); }
  else if (name === 'bighit') { burst(x, y, 26, ['#fff', '#ffd93d', '#ff9f1c'], 10); ring(x, y, 14, 5, '#ffd93d', 14); }
  else if (name === 'block') burst(x, y, 10, ['#bfe3ff', '#fff', '#5aa9ff'], 6);
  else if (name === 'down') { burst(x, y - 6, 14, ['#d9c7a6', '#b9a37f'], 4, 'dot'); shake = Math.max(shake, 6); }
  else if (name === 'slam') { ring(x, y, 20, 12, '#fff', 24, 0.18); ring(x, y, 10, 8, '#ffd93d', 30, 0.18); burst(x, y - 10, 24, ['#8a6a4a', '#5a4a3a', '#d9c7a6'], 8, 'dot'); shake = 18; }
  else if (name === 'tp') { burst(x, y, 30, ['#7a3bff', '#1b1b2f', '#bdb7ff'], 5, 'dot'); ring(x, y, 10, 6, '#bdb7ff', 16); }
}
function endConfetti() {
  if (matchWinner() < 0) return;
  for (let i = 0; i < 160; i++) {
    particles.push({ kind: 'conf', x: Math.random() * W, y: -20 - Math.random() * 300, vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2 + 1, life: 400, max: 400,
      c: CONFETTI[i % 6], s: 4 + Math.random() * 5, rot: Math.random() * 6, g: 0.02 });
  }
}
function stepFx() {
  for (const p of players) {
    // la barre de vie rouge rattrape la jaune ; petit pas de marche calculé à partir du déplacement (marche aussi chez l'invité)
    p.hpShow = p.hpShow > p.hp ? Math.max(p.hp, p.hpShow - 0.4) : p.hp;
    if (Math.abs(p.x - p.px) > 0.3 && p.st === 'free' && p.onGround) p.walkT += (p.x - p.px) * p.f > 0 ? 1 : -1;
    p.px = p.x;
    if (p.move === 'tornado' && p.hover) for (let k = 0; k < 3; k++) particles.push({ kind: 'dot', x: p.x + (Math.random() - 0.5) * 110, y: p.y - 60 - Math.random() * 110, vx: -p.f * 2, vy: -1.5, life: 20, max: 20, c: FIRE[(Math.random() * 5) | 0], s: 6 + Math.random() * 6, g: -0.05 });
    if (p.move === 'upper' && !p.onGround && frame % 2) particles.push({ kind: 'dot', x: p.x + p.f * 22, y: p.y - 205, vx: 0, vy: 1, life: 14, max: 14, c: '#ffd93d', s: 8, g: 0 });
    if (p.move === 'dash' && Math.abs(p.vx) > 5) particles.push({ kind: 'dot', x: p.x - p.f * 30, y: p.y - 10, vx: -p.f, vy: -1, life: 16, max: 16, c: '#d9c7a6', s: 7, g: 0 });
  }
  for (const q of projectiles) if (frame % 2) particles.push({ kind: 'dot', x: q.x - Math.sign(q.vx) * 18, y: q.y + (Math.random() - 0.5) * 20, vx: -Math.sign(q.vx) * 2, vy: 0, life: 16, max: 16, c: FIRE[(Math.random() * 4) | 0], s: 9, g: 0 });
  if (stage === 5 && frame % 4 === 0) particles.push({ kind: 'dot', x: Math.random() * W, y: H, vx: (Math.random() - 0.5), vy: -1.5 - Math.random() * 2, life: 200, max: 200, c: FIRE[(Math.random() * 5) | 0], s: 2 + Math.random() * 2, g: 0 });
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.vy += q.g; q.vx *= 0.96; q.x += q.vx; q.y += q.vy;
    if (q.kind === 'ring') q.r += q.dr;
    if (q.kind === 'conf') { q.vx *= 1.03; q.rot += 0.2; }
    if (--q.life <= 0 || q.y > H + 20 || q.y < -400) particles.splice(i, 1);
  }
  if (shake > 0) shake *= 0.86;
  if (shake < 0.3) shake = 0;
}

function ext(p) {
  const m = MOVES[p.move], t = p.t;
  if (t < m.st) return t / m.st;

  return Math.max(0, 1 - (t - m.st - m.act) / m.rec);

  ctx.font = font(22); outlinedText('📍 ' + STAGES[stage].name, W / 2, 490, '#fff', 6);
  if (mode === 'ai') drawPath();
}
// aventure : la suite des adversaires en haut de l'écran VS (battus ✔, celui du combat, Le Boss au bout)
function drawPath() {
  const n = ladder.length, gap = 74, x0 = W / 2 - (n - 1) * gap / 2;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.setLineDash([8, 8]);
  ctx.beginPath(); ctx.moveTo(x0, 36); ctx.lineTo(x0 + (n - 1) * gap, 36); ctx.stroke(); ctx.setLineDash([]);
  ladder.forEach((k, j) => {
    const x = x0 + j * gap, cur = j === ladderIdx, boss = k === BOSS;
    ctx.fillStyle = cur ? '#ffd93d' : boss ? '#8a1520' : 'rgba(27,27,47,.9)';
    ctx.beginPath(); ctx.arc(x, 36, cur ? 30 : 25, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.globalAlpha = j < ladderIdx ? 0.45 : 1;
    drawHead(CHARS[k], x, 36, -1, cur ? 50 : 40);
    ctx.globalAlpha = 1;
    if (j < ladderIdx) { ctx.font = font(26); outlinedText('✔', x + 16, 50, '#3ddc84', 5); }
    if (boss) { ctx.font = font(12); outlinedText('BOSS', x, 70, '#ff5b5b', 4); }
  });
  ctx.font = font(20);
  outlinedText('COMBAT ' + (ladderIdx + 1) + ' / ' + n + (ladder[ladderIdx] === BOSS ? ' · COMBAT FINAL !' : ''), W / 2, 96, '#fff', 5);
}
function bigText(t, y, col, size, k = 1) {
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k); ctx.rotate(-0.04);
  ctx.font = font(size); outlinedText(t, 0, 0, col, size / 8); ctx.restore();
}
function drawEnd() {
  dim(0.6);
  const win = matchWinner();
  if (win < 0) {
    bigText('ÉGALITÉ !', 120, '#ffd93d', 76);
    drawHead(CHARS[players[0].c], W / 2 - 120, 290, 1, 170);
    drawHead(CHARS[players[1].c], W / 2 + 120, 290, -1, 170);
  } else {
    const champion = mode === 'ai' && win === 0 && ladderIdx === ladder.length - 1;
    const title = champion ? 'CHAMPION !' : mode === 'local' ? 'VICTOIRE !' : win === me ? 'GAGNÉ !' : 'PERDU !';
    bigText(title, 110, COLORS[win].main, 80);
    drawHead(CHARS[players[win].c], W / 2, 290 + Math.sin(frame / 8) * 8, 1, 200, Math.sin(frame / 12) * 0.1);
    ctx.font = font(36); outlinedText(CHARS[players[win].c].name + ' gagne !', W / 2, 415, '#fff', 8);
  }
  ctx.font = font(34); outlinedText(wins[0] + ' - ' + wins[1], W / 2, 180, '#fff', 7);
  if (endNote) { ctx.font = font(24); outlinedText(endNote, W / 2, 40, '#ff7ad9', 6); }
  if (endT > 60) {
    let msg = touchMode ? 'Touche l’écran pour continuer' : 'Entrée pour continuer · Échap : menu';
    if (mode === 'ai') msg = win === 0 ? (ladderIdx + 1 < ladder.length ? 'Prochain adversaire : ' + CHARS[ladder[ladderIdx + 1]].name + ' ! ' : 'Tu as battu tout le monde ! ') + (touchMode ? '(touche)' : '(Entrée)') : 'Continuer ? ' + (touchMode ? 'Touche l’écran' : 'Entrée') + ' pour réessayer';
    ctx.font = font(20); outlinedText(msg, W / 2, 462, '#ffd93d', 5);
  }
}

function render() {
  if (state === 'menu') setStage(((frame / 300) | 0) % STAGES.length); // l'accueil fait défiler les décors
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.drawImage(bg, 0, 0, W, H);
  const inGame = IN_MATCH.includes(state) || state === 'end';
  if (inGame) {
    players.forEach(shadow);
    // celui qui attaque passe devant
    const order = players[0].st === 'atk' ? [1, 0] : [0, 1];
    order.forEach((i) => drawFighter(players[i]));
    projectiles.forEach(drawProjectile);
  }
  for (const q of particles) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = q.kind === 'conf' ? 1 : a;
    if (q.kind === 'ring') { ctx.strokeStyle = q.c; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(q.x, q.y, q.r, q.r * q.flat, 0, 0, 7); ctx.stroke(); }
    else if (q.kind === 'spark') { ctx.strokeStyle = q.c; ctx.lineWidth = q.s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 2.5, q.y - q.vy * 2.5); ctx.stroke(); }
    else if (q.kind === 'conf') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore(); }
    else { ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.s * (0.4 + a * 0.6), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'menu') drawMenu();
  else if (state === 'level') drawLevel();
  else if (state === 'select') drawSelect();
  else if (state === 'wait') drawWait();
  else if (state === 'vs') drawVs();
  else if (state !== 'end') drawHud();
  if (state === 'intro') {
    drawTouchHelp();
    if (cd > 50) bigText(round === 3 ? 'MANCHE FINALE' : 'MANCHE ' + round, H / 2 - 40, '#fff', 80, Math.min(1, (120 - cd) / 10));
    else bigText('FIGHT !', H / 2 - 40, '#ffd93d', 120, Math.min(1, (50 - cd) / 6) * 1.1);
  }
  if (state === 'ko') {
    const k = Math.min(1, (180 - koT) / 10);
    bigText(koMsg, H / 2 - 60, '#ff3b3b', koMsg.length > 5 ? 90 : 140, k);
    if (koT < 130) {
      ctx.font = font(34);
      outlinedText(roundWin < 0 ? 'Personne ne gagne la manche' : CHARS[players[roundWin].c].name + ' gagne la manche !', W / 2, H / 2 + 30, roundWin < 0 ? '#fff' : COLORS[roundWin].main, 7);
      if (perfect) bigText('PERFECT !', H / 2 + 90, '#ffd93d', 56);
    }
  }
  if (IN_MATCH.includes(state)) drawButtons();
  if (state === 'end') drawEnd();
}

// ================= boucle =================
fitCanvas(); setStage(0); drawBackground();
document.fonts?.load(font(20)).then(drawBackground).catch(() => {});
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if (DEBUG) {
  window.__hb = {
    consts: { W, H, GROUND, ROUND_TIME, WIN_ROUNDS }, chars: CHARS, pickable: PICKABLE, boss: BOSS, gridPos, moves: MOVES, menu: MENU, levels: LEVELS, aiLevels: AI_LEVELS, stages: STAGES,
    // start(a, b, { mode, ai: [niveau J1, niveau J2] }) : combat direct, écran VS et « FIGHT » sautés
    start(a = 0, b = 3, o = {}) {
      toMenu(); mode = o.mode || 'local'; pick[0] = a; pick[1] = b;
      aiSlots[0] = o.ai ? o.ai[0] : null; aiSlots[1] = o.ai ? o.ai[1] : null;
      if (aiSlots[1] !== null) aiLevel = aiSlots[1];
      ladder = [b]; ladderIdx = 0;
      startMatch(); startRound(); cd = 1; step();
    },
    toMenu, toSelect, chooseMenu, chooseLevel, key: uiKey, tap: (x, y) => uiTap({ x, y }),
    run(n = 1) { for (let i = 0; i < n; i++) step(); },
    // touches : left right up down p k s
    press(i, k) { dbgHeld.add(i + ':' + k); }, release(i, k) { dbgHeld.delete(i + ':' + k); }, releaseAll() { dbgHeld.clear(); },
    info: () => ({ state, mode, aiLevel, aiSlots: [...aiSlots], me, round, wins: [...wins], timeLeft, pick: [...pick], ready: [...ready], touchMode, koMsg, roundWin, endNote, waitMsg, stage, ladder: [...ladder], ladderIdx,
      net: net ? { role: net.role, ready: net.ws.readyState } : null }),
    players: () => players, projectiles: () => projectiles, ctl: () => ctl, touches: () => [...touches.values()],
    pollLobby, lobby: () => lobby,
    setTime(s) { timeLeft = s; }, setHp(i, v) { players[i].hp = v; }, setTouchMode(b) { touchMode = b; }, render,
  };
}
</script>
</body>
